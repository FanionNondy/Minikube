apiVersion: v1
kind: Pod
metadata:
  name: multi
  namespace: default
  labels:
    app: multi
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 8080
    - name: sidecar
      image : busybox
      command: ["sh", "-c","while true;do 'I love you ' sleep 5; done"]
    