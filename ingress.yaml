apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fanion-ingress
  labels: 
    app: nginx
  namespace: default
  annotations: 
    nginx.ingress.kubernetes.io/rewrite-targe: /
spec:
  ingressClassName: nginx
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 8080
  tls:
    - hosts:
        - example.com
      secretName: tls-secret